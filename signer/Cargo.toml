[package]
name = "kaspi-probe-signer"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[workspace]
members = ["vendor/isideload", "vendor/apple-codesign-quick"]
default-members = ["."]
resolver = "2"

[dependencies]
isideload = { path = "vendor/isideload" }
idevice = { version = "=0.1.68", default-features = false, features = ["ring", "usbmuxd", "afc", "installation_proxy", "remote_pairing", "rsd"] }
plist = "=1.8.0"
rootcause = "=0.12.0"
rpassword = "=7.4.0"
sha2 = "=0.11.0"
tokio = { version = "=1.49.0", features = ["rt-multi-thread", "macros", "time"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
zeroize = "1.8"
serde_json = "1.0"
tempfile = "3.23"
zip = { version = "8.3", default-features = false, features = ["deflate"] }

[patch.crates-io]
apple-codesign-quick = { path = "vendor/apple-codesign-quick" }

[profile.release]
strip = true
