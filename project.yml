name: KaspiProbe
options:
  deploymentTarget:
    iOS: '26.5'
  developmentLanguage: ru
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
    GENERATE_INFOPLIST_FILE: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targetTemplates:
  probeApp:
    type: application
    platform: iOS
    sources: [App, SignatureCore]
    info:
      path: build/${target_name}-Info.plist
      properties:
        CFBundleDisplayName: Kaspi Probe
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocalNetworkUsageDescription: Проверка соединения с вашим Windows-ПК. Банковские данные не передаются.
        NSBluetoothAlwaysUsageDescription: Поиск вашего тестового приёмника на Windows.
        NSAccessorySetupKitSupports: [Bluetooth]
        NSAccessorySetupBluetoothServices: ['5CC0C4AB-2D7F-4B59-B527-0D867E11FD10']
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: YES
        ITSAppUsesNonExemptEncryption: NO
  probeExtension:
    type: extensionkit-extension
    platform: iOS
    settings:
      base:
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: build/${target_name}-Info.plist
targets:
  InstallProbe:
    templates: [probeApp]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: site.shrks.kaspiprobe.install
    info:
      properties:
        CFBundleDisplayName: Kaspi Install Probe
        ProbeVariant: basic
  AccessProbe:
    templates: [probeApp]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: site.shrks.kaspiprobe.access
    info:
      properties:
        CFBundleDisplayName: Kaspi Access Probe
        ProbeVariant: capabilities
    dependencies:
      - target: ProbeDataProvider
        embed: true
      - target: ProbeSecurity
        embed: true
      - target: ProbeTransport
        embed: true
  ProbeDataProvider:
    templates: [probeExtension]
    sources: [Extensions/DataProvider]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: site.shrks.kaspiprobe.access.data
    entitlements:
      path: build/ProbeDataProvider.entitlements
      properties:
        com.apple.developer.accessory-data-provider: YES
    info:
      properties:
        EXAppExtensionAttributes:
          EXExtensionPointIdentifier: com.apple.accessory-data-provider
          EXCapabilities: [AccessoryNotifications.NotificationsForwarding]
  ProbeSecurity:
    templates: [probeExtension]
    sources: [Extensions/Security]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: site.shrks.kaspiprobe.access.security
    entitlements:
      path: build/ProbeSecurity.entitlements
      properties:
        com.apple.developer.accessory-transport-security: YES
    info:
      properties:
        EXAppExtensionAttributes:
          EXExtensionPointIdentifier: com.apple.accessory-transport-security
  ProbeTransport:
    templates: [probeExtension]
    sources: [Extensions/Transport]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: site.shrks.kaspiprobe.access.transport
    entitlements:
      path: build/ProbeTransport.entitlements
      properties:
        com.apple.developer.accessory-transport-extension: YES
    info:
      properties:
        EXAppExtensionAttributes:
          EXExtensionPointIdentifier: com.apple.accessory-transport-extension
schemes:
  InstallProbe:
    build:
      targets:
        InstallProbe: all
  AccessProbe:
    build:
      targets:
        AccessProbe: all
