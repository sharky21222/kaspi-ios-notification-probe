workflows:
  xcode-capability-audit:
    name: Read public Xcode accessory signing rules - no account
    instance_type: mac_mini_m2
    max_build_duration: 5
    environment:
      xcode: '27.0'
    scripts:
      - name: Inspect only public Xcode definitions
        script: python3 scripts/inspect_xcode_capabilities.py
    artifacts:
      - output/xcode-accessory-capabilities.json
  probe-ios:
    name: Installation and capability probes
    instance_type: mac_mini_m2
    max_build_duration: 20
    environment:
      xcode: '27.0'
    scripts:
      - name: Build, test, and package without Apple credentials
        script: bash scripts/build_probes.sh
    artifacts:
      - output/*.ipa
      - output/manifest.json
      - output/install-probe.png
      - build-*.log
  signer-windows:
    name: Patched Windows probe signer - no Apple credentials
    instance_type: mac_mini_m2
    max_build_duration: 20
    environment:
      xcode: '27.0'
      vars:
        CI: 'true'
    cache:
      cache_paths:
        - $HOME/.cargo/registry
        - $HOME/.cache/kaspi-xwin
        - $CM_BUILD_DIR/signer/target
    scripts:
      - name: Prepare Rust and run offline signer tests
        script: bash scripts/build_signer.sh test
      - name: Cross-compile and package the Windows signer
        script: bash scripts/build_signer.sh windows
    artifacts:
      - output/Kaspi-Probe-Signer-Windows.zip
      - output/signer-manifest.json
      - build-signer-*.log
